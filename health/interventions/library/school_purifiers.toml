[[evidence]]
fields = ["cost.annual"]
source = "Xiaomi India store listing, Xiaomi Smart Air Purifier 4 Filter"
url = "https://store.mi.com/in/products/453-0-8-1-0-1"
locator = "Listing 'TV & Smart Home': 'Xiaomi Smart Air Purifier 4 Filter ₹3,499'; replacement interval from the filter's page (https://www.mi.com/in/product/xiaomi-smart-air-purifier-4-filter/): 'It is recommended to replace the filter every 6–12 months.'"
key = "O"
retrieved = "2026-11-27"
derivation = "one to two filters a year per classroom, per child: p5 = 3,499 / 50 = 70, p95 = 2 x 3,499 / 27 = 259. 2026 price taken as 2025 rupees."
