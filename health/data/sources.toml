Column meaning read from the workbook's own formulas (sheet 'Burden_YesCN_NCD+LRI', e.g. cell C91):
HR = EXP(LN(1 + z/E) / (1 + EXP((F - z)/G)) * C), z = MAX(0, PM2.5 - 2.4), so C = theta, E = alpha, F = mu, G = nu; D is 'se'.
