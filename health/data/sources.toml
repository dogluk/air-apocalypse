source = "City, NCAP and journal source-apportionment studies transcribed by hand from their reports, one row per source, same columns as causes.csv (schema in airhealth/causes.py; origin included). 316 rows, 23 study ids, 11 cities' reports and papers: ARAI/TERI Delhi 2018, Govardhan et al. 2024 (GMD), Biswal et al. 2025 and Kulkarni et al. 2020 (Delhi stubble), TERI Kolkata 2025, Lucknow 2022, Patna 2021, Surat 2021, IIT Kanpur Kanpur 2022, Agra 2021, Hyderabad 2023, NEERI/IITB Mumbai 2023 and Pune 2024, CSTEP Bengaluru 2022. Read by scripts/build_causes.py."
url = "per row: each row's own `url` column (the report PDF or journal page the row was read from); there is no single URL"
locator = "Each row's own `locator` column: the table or figure, the page where the shares are printed, and where the sampling months are stated."
retrieved = "2026-11-12"
licence = "The reports and papers keep their own copyright and licences (state and NCAP reports, journal articles); none is redistributed and no PDF is in the repo. Only the figures are tabulated, with citation (facts), per row."
method = "transcribed"
notes = """
Every row is evidence O (read in the report or the paper). No press-only or from-memory number is in the file; those leads are in MISSING.md.
Sectors and `origin` follow the study type: CMAQ/WRF-Chem sector tables and CMB/PMF receptor shares are all_origins, geographic splits are region
(local_all = the city's own sources, all sectors). A group with covers = all sums to 100 +/- 2; partial groups (stubble-only, Lucknow monsoon)
do not. Derived values are marked DERIVED in their locator (Kolkata summer HMC slice = 60 - 12 - 46). Mapping calls (coal and fly ash -> other,
Kolkata cooking -> residential, transport including DG sets) are stated in the locators; source_raw keeps each report's own words.
"""

