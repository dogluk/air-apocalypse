AN91, 2,219,057 deaths, age-specific functions, PM2.5 74.0) equals PNAS Table 1, India, GEMM NCD+LRI, 100% rollback, 2,219
thousand. The all-age '25+' row (0.143, 0.01807) and the 'EXcluding China' block are not used.
Check against the workbook, 2026-11-10: all 60 parameter cells and 12 age labels compared by script (openpyxl, values only), no mismatch.
"""

