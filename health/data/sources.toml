notes = """
Columns: state, unit (geoBoundaries district), year (2023), pm25 (µg/m³, total PM2.5 including dust and sea salt), population
(WorldPop 2023 persons, summed over the district's pixels). population_total is the sum of the WorldPop India raster.
Year: 2023 is the last year of V6.GL.02.04 and the last year of the AQLI 2025 release, so the two maps share a year.
ACAG has since published V6.GL.03 (1998-2024) in the same bucket; not used here, the build pins V6.GL.02.04.
Method (script docstring): each WorldPop pixel takes the 0.1° cell and the district containing its centre; 4,752 populated
pixels (1,056,060 people, 0.074%) fall outside every district polygon and go to the nearest district (at most 16 pixels away).
No populated pixel falls in an empty ACAG cell. Corrections to geoBoundaries: Yanam put in Puducherry (the ADM1 outline
leaves it in Andhra Pradesh; by area overlap it is the only misplaced district); 'Hydrabad' spelled Hyderabad; a Ladakh unit
named 'DATA NOT AVAILABLE' (4,507 people) written as 'Unnamed area'; trailing spaces stripped ('North ').
Cross-check: India population-weighted mean 49.8 here against 47.1 in ACAG's own region summary
(archive/V6GL0204/RegionSummaries/GlobalPM25-V6GL0203-Annual-1998-2023-wThresFrac.csv, labelled V6GL0203 and weighted by
ACAG's population); states differ from ACAG's state summary by -7 to +9 µg/m³, most within ±5 (largest: Assam +9.0,
Lakshadweep -6.8). Running the same
script on the 0.01° file gives 50.2, so resolution is not the gap; the label suggests the summary is the earlier
V6.GL.02.03 data, which V6.GL.02.04 revised for 'abnormally low values'.
WorldPop R2025A puts fewer people in the densest cores than the census does (Mumbai island ~0.9 million) and more in some
surrounding districts; this moves district weights within a state, not the cities' populations (cities.csv).
Use: airhealth.exposure keeps this file's split of each state among its districts and scales the state to the official
projection (population_age_state.csv) for the year asked.
"""

