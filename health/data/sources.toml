(Hubli-Dharwad for 'Dharwad-Hubli', Asansol-Durgapur, Dhanbad-Bokaro, Raipur-Durg-Bhilai for 'Raipur-Durg-Bhillai',
Panaji for 'Panjim-Vasco-Margao', Tiruchirappalli for 'Tiruchirapalli'). Allahabad keeps APnA's spelling (Prayagraj is an
alias in places.csv). Chandigarh and Puducherry are also state names, so the bare name resolves to the state, as Delhi does.
Entries used: Panaji = Panaji U.A + Mormugao U.A. + Margao U.A.; Puducherry = Puducherry U.A. + Cuddalore (Tamil Nadu);
Chandigarh = Chandigarh U.A. + Patiala U.A. + Ambala U.A. (205,418: Ambala Sadar, Ambala Cantt., Babiyal, Kardhan) +
Ambala (entry 239, Ambala City, M.Cl., 195,153; it is a separate entry, not inside the Ambala U.A.; checked in the workbook
2026-11-12), 1,817,419 in all;
Vijayawada = Vijayawada U.A. + Guntur U.A. + Tenali; Dhanbad-Bokaro = Dhanbad U.A. + Bokaro Steel City U.A.;
Raipur-Durg-Bhilai = Raipur U.A. + Durg-Bhilainagar U.A.; Asansol-Durgapur = Asansol U.A. + Durgapur U.A.
Units: the satellite maps need all units in the city's state, so the two airsheds across a state line (Chandigarh: Patiala
in Punjab, Ambala in Haryana; Puducherry: Cuddalore in Tamil Nadu) list only the home state's unit, though their population
