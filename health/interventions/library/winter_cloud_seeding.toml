url = "https://www.hindustantimes.com/cities/lucknow-news/15-stations-set-up-for-trial-in-delhi-showed-6-10-less-pollution-says-iit-kanpur-director-101761768534627.html"
locator = "paragraph 2: 'data collected from 15 air quality monitoring stations ... showed a reduction of about 6-10% in PM2.5 and PM10 levels following the trial'. Indian Express (https://indianexpress.com/article/cities/delhi/delhi-pollution-dip-cloud-seeding-data-10335630/): at Burari 'PM 2.5 levels had already dropped sharply from 198 to 88 ug/m3 between 9 am and 1 pm before the first seeding window' and rose to 144 by midnight"
key = "S"
