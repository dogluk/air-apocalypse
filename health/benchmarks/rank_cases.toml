# Ranking benchmarks: published cost rankings against this tool's library measures.
# benchmarks/rank_run.py computes each case and writes RANKING.md; tests/test_rank_benchmarks.py
# checks the tested ones.
#
# Same rules as cases.toml. Each case states the ratio it expects (ours / published), worked out
# from the known differences in inputs and not from the result, and a narrow band around it; a
# case passes when |ratio / expected_ratio - 1| <= tolerance. Nothing is tuned to close a gap
# (AGENTS.md rule 5): a case outside its band either had an error in its reasoning that can be
# named (fixed in expected_why, saying what) or becomes tested = false with the gap written down
# as unexplained. tested = false cases are still run and shown in RANKING.md; why_untested says
# why they are not held to a band.
#
# kind:
#   per_life           mean cost / mean deaths postponed, if it works, in 2025 rupees; published is
#                      rupees (or dollars) per death postponed in published_currency of published_year.
#   per_ugm3           cost (cost_basis) / |population-weighted annual PM2.5 change| (median), in
#                      2025 rupees; published is BILLION rupees (or dollars) per µg/m³.
#   ratio_of_measures  per_life(measure) / per_life(other_measure); published is the paper's own
#                      ratio (published_currency and published_year are not used).
#   order              share of pairs of measures (in published_values, both computable here) that
#                      fall in the same order as the paper's; published is 1 by definition.
# place: "region" (score.region, the measure's whole reach) or a city name (score.city).
# causes_study (optional): the causes study for an air measure in a city (default: the city's APnA study).
# discount: the paper's own discounting where it has one (0 where it has none).
#
# Every published value was read at its source on 2026-11-27 (locator says where); the PDFs are
# not committed.

[[case]]
id = "jjkp2025_pes_per_life"
study = "Jack, Jayachandran, Kala, Pande 2025, AER: Insights 7(1): 39-55"
source_url = "https://seemajayachandran.com/money_not_to_burn.pdf"
locator = "Abstract ('The cost per life saved is $3,600-$5,400'); Section III 'Program Costs and Benefits', p. 52: up-front PES costs Rs 4,050 (maximum accuracy) and Rs 2,695 (balanced accuracy) per unburned acre (Figure 2, p. 51); Lan et al. 2022's 86,000 deaths from crop burning in 2018, 43 percent from kharif burning in Punjab; about 4 million acres of Punjab paddy burned in kharif 2018 (Kumar et al. 2019); '$6,400 per acre (Rs 513,000)'. Same text at doi 10.1257/aeri.20230431."
published = 364_800
published_text = "$3,600 to $5,400 per life saved: Rs 2,695 to 4,050 per unburned acre (kharif 2019) over 86,000 x 0.43 / 4 million = 0.00925 deaths per acre burned, Rs 291,500 to 438,100 per life, at the paper's own rate of about 80.2 rupees a dollar ($6,400 = Rs 513,000); the midpoint, Rs 364,800 in 2019 rupees, is used"
published_currency = "INR"
published_year = 2019
kind = "per_life"
measure = "stubble_pes_upfront"
other_measure = ""
place = "region"
curve = "gemm_ncd_lri"
map = "acag_total"
discount = 0.0
cost_basis = "total"
expected_ratio = 22.0
tolerance = 0.10
expected_why = """
Two things set the ratio, and only one can be worked out from inputs. Cost: ours is what the funder
pays per acre offered, averaged over everyone offered (Rs 310.5, the paper's Table 6 figure) plus
monitoring of 0 to 100 (the paper leaves monitoring out), over Punjab's 7.83 million acres for five
years: Rs 17.6 billion in 2025 rupees, undiscounted. Deaths: ours are the cut (mean 0.0705 of
all crop-burning smoke) times the deaths from all crop burning on data/receptor_stubble.csv, whose
India-wide population-weighted change is 0.483 µg/m³, times five years of effect (the lag's tail
delivers all of it). The paper's deaths are Lan et al.'s: 69,000 a year on average over 2003-19 at
6.7 µg/m³ India-wide. If deaths per person-µg/m³ were the same in both (Lan's IER slope taken equal
to the GEMM's, populations not adjusted), all crop burning on our table would cause 69,000 x
0.483 / 6.7 = 4,975 deaths a year, and ours would be 17.6e9 / (5 x 0.0705 x 4,975) = Rs 10.06
million per death against the paper's Rs 364,800 x 1.251 (2019 to 2025) = Rs 456,400: 22.0. Most
of that is the receptor table, 14 times smaller than Lan et al.'s national exposure.
"""
band_why = "Not held to a band (see why_untested); the band shown is the one a tested case would carry."
in_short = "Our cost per death postponed for paying Punjab's farmers not to burn is far above the paper's, and mostly for one known reason: the stubble smoke table this tool uses (a fallback built from McDuffie et al.'s global model) puts India's exposure to crop-burning smoke at 0.48 µg/m³, against 6.7 in Lan et al. 2022, whose deaths the paper uses. That alone makes each rupee buy about 14 times fewer deaths. The paper also counts the deaths from all of Punjab's kharif burning against 4 million burned acres, while we cut a share of all crop-burning smoke in proportion to the trial's effect. The curve slope (Lan used the IER, we the GEMM) cannot be worked out here, so the case is shown, not tested."
tested = false
why_untested = "The paper's deaths come from Lan et al. 2022's IER-based count, and the tool has no IER curve, so the ratio of the two curves' slopes at India's levels cannot be worked out from inputs; the expectation takes them equal, and any remaining gap is unexplained."

[[case]]
id = "dcp3_fgd_per_life"
study = "Cropper, Guttikunda, Jawahar, Malik, Partridge 2017, DCP3 vol. 7 ch. 13"
source_url = "https://dcp-3.org/sites/default/files/chapters/DCP3%20Injury%20%26%20Environment_Ch13.pdf"
locator = "p. 243, 'Results': 'requiring all 72 plants in our study to install scrubbers would save 12,890 lives and 329,000 DALYs annually, at an average cost of US$131,000 per life saved'; Table 13.6 (total lives saved 12,890, total cost US$1,691 million); note 17 (US$1.69 billion divided by lives saved); note 14 (p. 245): rupee costs converted at US$1 = Rs 55, 'and are thus in 2013 US$'; p. 242: lives counted at 80 percent of the ultimate reduction (a scrubber in operation at least five years); Table 13.1: 72 plants, average nameplate capacity 948 MW (2008-09 fleet)."
published = 7_205_000
published_text = "US$131,000 per life saved, all 72 plants of the 2008-09 fleet (12,890 lives a year for an annualised US$1.69 billion); the chapter's dollars are rupees at Rs 55 each, so Rs 7,205,000 in 2013 rupees (as the library's fgd_scrubbers takes its costs)"
published_currency = "INR"
published_year = 2013
kind = "per_life"
measure = "fgd_scrubbers"
other_measure = ""
place = "region"
curve = "gemm_ncd_lri"
map = "acag_total"
discount = 0.0
cost_basis = "total"
expected_ratio = 0.566
tolerance = 0.10
expected_why = """
Cost per MW: the chapter annualises capital at 8% over 20 years and adds running costs at an 85%
capacity factor: US$1,691 million a year for 72 plants of about 948 MW each (68,256 MW), Rs 1,362,600
per MW a year in 2013 rupees. Ours, undiscounted (the case's discount 0): Rs 7.8 million once plus
Rs 501,550 a year (capacity factor 60.9% to 85%) for 20 years, over the 18.5 years of full effect
the four-year ramp gives: Rs 963,800 per MW per year of effect, 0.707 of the chapter's. Deaths: the
chapter counts 80% of the ultimate reduction; our run counts all of it (the lag's tail delivers
it), so ours is 0.8 as dear per death on that count. 0.707 x 0.8 = 0.566, if deaths averted per MW
scrubbed were the same in both; they cannot be worked out from inputs (why_untested).
"""
band_why = "Not held to a band (see why_untested)."
in_short = "Scrubbers on the whole coal fleet. Our cost per MW is about 0.7 of the chapter's (no 8% capital charge; a lower capacity factor at the low end), and we count all of the eventual fall in deaths where the chapter counts 80% of it. What cannot be matched is deaths per MW scrubbed: the chapter modelled each of 72 plants of the 2008-09 fleet with a dispersion model and the IER slope at India's 2010 national mean; we use Cropper et al. 2021's state averages for the 2018 fleet (208 GW), the GEMM district by district, and a cut of 0.27-0.59 of the plants' PM2.5."
tested = false
why_untested = "Deaths averted per MW scrubbed differ by plant mix (72 plants of 2008-09 against the 2018 fleet), exposure model (plant-by-plant CAMx against state averages) and curve (IER linearised at the 2010 national mean, which the tool does not have, against the GEMM by district); no input links the two, so the expectation takes them equal and any remaining gap is unexplained."

[[case]]
id = "jjkp2025_pes_vs_fgd"
study = "Jack, Jayachandran, Kala, Pande 2023, MIT CEEPR Working Paper 2023-05 (NBER w30690)"
source_url = "https://ceepr.mit.edu/wp-content/uploads/2023/02/MIT-CEEPR-WP-2023-05.pdf"
locator = "Section 5, printed p. 25 (PDF p. 28): scrubbers 'would save 150 lives per year, and costs about $1.2 billion over 20 years ... the cost per life saved is around $400,000. For comparison, the cost per life saved from our most cost effective treatment is $4,800'; footnote 46: '$4,791.11 per life saved'; also the introduction, printed p. 5: 'roughly $400,000 (Cropper et al., 2019) versus $4,800 to 7,200 for upfront PES'. The published version (AER: Insights 2025) drops the comparison."
published = 83.33
published_text = "Scrubbers about $400,000 per life saved against $4,800 for up-front payments: 83 times as dear (working paper; the published version leaves the comparison out)"
published_currency = "USD"
published_year = 2023
kind = "ratio_of_measures"
measure = "fgd_scrubbers"
other_measure = "stubble_pes_upfront"
place = "region"
curve = "gemm_ncd_lri"
map = "acag_total"
discount = 0.0
cost_basis = "total"
expected_ratio = 0.01738
tolerance = 0.10
expected_why = """
Our ratio, from our own inputs, divided by the paper's 83.33. Costs, undiscounted, 2025 rupees:
scrubbers 208,000 MW x (Rs 7.8 million + 20 x Rs 501,550) x 1.510 (2013 to 2025) = Rs 5,599
billion; payments 7,825,827 acres x Rs 360.5 x 5 years x 1.251 (2019 to 2025) = Rs 17.65 billion.
Years of full effect: 18.5 and 5 (simulate.yearly_shares). Mean cuts: 0.43 and 0.0705. Deaths
from removing the whole source, taken as proportional to the sum over districts of people x full
change x the GEMM's slope (d ln RR / d PM2.5 at age 60) at the district's acag_total level:
29.05 million for receptor_power_cropper2021.csv (720 districts, mean 4.47 µg/m³) and 2.994
million for receptor_stubble.csv (735 districts, mean 0.483); 9.705 times (9.21 without the slope:
the stubble smoke lands where the air is a little dirtier, 57.5 µg/m³ against 51.8 weighted by
change). Ours = (5,599e9 / (18.5 x 0.43 x 29.05)) / (17.65e9 / (5 x 0.0705 x 2.994)) = 1.449;
1.449 / 83.33 = 0.01738. Why ours is so far from the paper's: the stubble table is 14 times
smaller than Lan et al.'s exposure (which the paper's deaths rest on), our scrubber cut is about
0.43 of the plants' PM2.5 where the paper takes 72% of GBD's 84,650 power-plant deaths, and our
fleet's full change (4.47 µg/m³) is large next to the stubble table's.
"""
band_why = "The band holds what the proportional estimate leaves out: death rates differ by state (the SRS scaling) and the GEMM's slope differs by age, so the two sources' deaths need not scale exactly with people x change x the age-60 slope."
in_short = "The working paper's own comparison: scrubbers cost 83 times as much per life saved as paying farmers not to burn. In this tool they come out only about 1.4 times as dear, and the reasons are inputs we know: the stubble smoke table is a fallback 14 times smaller than the exposure the paper's deaths rest on, while the scrubber table (Cropper et al. 2021) is a full chemical-transport model of the 2018 fleet. The case checks that our two runs land where those inputs say."
tested = true
why_untested = ""

[[case]]
id = "teri2021_delhi_old_vehicle_retirement"
study = "TERI 2021, Cost effectiveness of interventions for control of air pollution in Delhi"
source_url = "https://teriin.org/sites/default/files/2021-12/Cost-effectiveness-of%20-interventions-for-control-of%20-air-pollution-in-Delhi.pdf"
locator = "Table 36 'Cost effectiveness of different control options in terms of cost in Billion Rupees per microgram per m3 of PM2.5 removed from ambient air in Delhi (wrt BAU)', printed p. 60 (PDF p. 71), row 6 'FM trucks & buses', 2022: 11. Table 35, printed p. 58 (PDF p. 69): '100% Fleet Modernization of trucks and buses to BS VI by 2022, 2025 and 2030 | 110 | 203 | 292' (billion Rs, net cumulative, 10% discount). Text below Table 36: costs are net present values from 2019, reductions are annual for the year. Executive summary (PDF p. 12): winter PM2.5 129-164 µg/m³ in BAU; Table 7 contd. (printed p. 35, PDF p. 46): fleet modernisation of trucks and buses -6% of Delhi's winter PM2.5 in 2022 (ALT-NCR w.r.t. BAU). No price year is stated; taken as 2021 (report dated December 2021), as the library's old_vehicle_retirement takes its cost."
published = 11.0
published_text = "Rs 11 billion per µg/m³ of Delhi's PM2.5 removed, fleet modernisation of trucks and buses to BS-VI across NCR by 2022 (Rs 110 billion net, about 10 µg/m³ off Delhi's winter level)"
published_currency = "INR"
published_year = 2021
kind = "per_ugm3"
measure = "old_vehicle_retirement"
other_measure = ""
place = "Delhi"
causes_study = "arai_teri_delhi2018_dispersion"
curve = "gemm_ncd_lri"
map = "acag_total"
discount = 0.0
cost_basis = "total"
expected_ratio = 1.160
tolerance = 0.06
expected_why = """
Our cut and cost both come from TERI, so this tests the share x cut arithmetic. Cost: TERI's NCR
net cost divided by NCR's 70 million people, Rs 1,571 to 4,171 per person (median 2,871), times
Delhi's 16.35 million people on the acag_total map, against TERI's Rs 110 billion: 16.35e6 x
2,871 / 110e9 = 0.4267 (both in the same price year, so the deflator cancels). Change in PM2.5:
TERI's implied 110 / 11 = 10.0 µg/m³ (6% of a 164 µg/m³ winter); ours is the transport share of
Delhi's PM2.5 in the ARAI-TERI 2018 dispersion study (Delhi has no APnA study): 28% in winter
(Nov-Feb) and 17% in summer (Apr-Jun), no figure for the other months (no credit), weighted by
Delhi's monthly shape (CPCB 2023-25): 19.60%; times the median cut 0.19 (TERI's 6% to 32%) times
Delhi's annual level 98.80 µg/m³: 3.680 µg/m³. 0.4267 x 10.0 / 3.680 = 1.160.
"""
band_why = "TERI prints 11 for a figure between 10.5 and 11.5 (about 5%); our median change comes from 2,000 draws of a single cut, close to exact."
in_short = "Both our cut (6-32% of transport's emissions) and our cost (TERI's NCR net cost per person) are TERI's own, so the case tests the share-times-cut arithmetic, not the inputs. TERI's 11 billion rupees per µg/m³ is its 2022 figure against Delhi's winter air, about 10 µg/m³ off 164; ours is the whole year at Delhi's 98.8 µg/m³ with transport's share from ARAI-TERI 2018 (19.6% weighted by month; an all-origins share, so an upper bound), and Delhi's people alone pay for it. Expected: 1.16 times TERI's."
tested = true
why_untested = ""

