2011 figures, not the provisional ones. The original 11 rows (Delhi to Lucknow) are unchanged.
modelling call (not in any source): an airshed's population is the SUM of the Class I entries for the towns its APnA name
lists. A town inside another listed entry's U.A. is not added again (Howrah in Kolkata U.A.; Pimpri-Chinchwad in Pune U.A.;
Gandhinagar in Ahmadabad U.A.; Vasco da Gama taken to be in Mormugao U.A.). A listed town that is not a Class I entry is
left out: Tarn Taran (Amritsar) and Phillaur (Ludhiana). Dispur is part of Guwahati U.A.
