# Bengaluru: enforcing the ban on open waste burning, with full door-to-door collection.
name = "Ending open waste burning in Bengaluru"
kind = "air"
scope = "city"
who_reaches = "everyone in Bengaluru, through the outdoor air"
cities = ["Bengaluru"]

start_year = 2027
ramp_years = 1
duration_years = 10
lag = "epa20"

p_success = 0.35
p_success_basis = "judgement: open burning has been banned under the Solid Waste Management Rules since 2016 and still goes on; success needs collection that actually reaches every street, not only a ban"

placeholders = []

notes = """
The ban on burning rubbish in the open is enforced (patrols, fines, audits of the contractors who
collect waste), with door-to-door collection and segregation at 100%.

This is Bengaluru's own evidence: CSTEP (2022), working for the Karnataka State Pollution Control
Board, puts the cut in waste-burning emissions at 20% (low scenario), 30% (medium) and 50% (high);
those are used as the low end, most likely value and high end.

The cost is CSTEP's estimate of what the city government spends on the policy: "<1" crore,
taken here as each year, from a tenth of a crore (a judgement) to one crore. CSTEP assumes the
city's planned waste-treatment plants give enough capacity by 2024; the cost of making collection
reach every household, if that capacity or collection is not there, is not in it and has not been
found at its source (see data/MISSING.md). The ratio therefore rests on a policy-only cost.

CSTEP's own receptor study of Bengaluru (cstep_bengaluru2022_cmb) does not report waste burning,
so this measure gets no credit on that study: not reported is not zero.

city-specific: the cut is CSTEP's Bengaluru scenario (20-50% of waste burning) and the cost is BBMP's enforcement budget (CSTEP); another city needs its own.
"""

[[targets]]
cause = "waste_burning"
cut = { dist = "triangular", p5 = 0.2, mode = 0.3, p95 = 0.5 }

[cost]
driver = "city"
annual = { dist = "uniform", p5 = 1000000, p95 = 10000000 }
currency = "INR"
year = 2021
partial = "The cost is CSTEP's estimate of the city government's spending to enforce the ban (under Rs 1 crore); it leaves out the cost of making door-to-door collection reach every household and of any missing treatment capacity, which has not been found at its source (data/MISSING.md)."

# The whole cost, for the what-if `full_cost` only (the default ranking keeps the partial cost
# above, flagged): enforcement plus the added cost of collecting the waste now burned. The money
# figures are newspaper reports of officials (the primary budget documents were not reached), so
# both ends are key S.
[cost.full]
low = 121000000
high = 1140000000
dist = "lognormal"     # a judgement: the ends are 9 times apart, from different routes
currency = "INR"
year = 2025            # nominal 2025-26 rupees (the 2026 contract figure taken as 2025: the price tables stop at 2025)
adds = "The added yearly cost of making collection reach the waste now burned, on top of the city's enforcement."

[[cost.full.evidence]]
fields = ["cost.full.low"]
source = "New Indian Express, 30 October 2026, 'New waste collection fleet for Bengaluru to cost Rs 4,500 crore' (a minister's cabinet briefing, reported)"
url = "https://www.newindianexpress.com/cities/bengaluru/2026/Oct/30/new-waste-collection-fleet-for-bengaluru-to-cost-rs-4500-crore"
locator = "article text: about Rs 598 crore a year now on collection to transport; new 7-year contracts (33 packages) of Rs 4,000-4,500 crore, about Rs 610 crore a year, to improve collection coverage"
key = "S"
retrieved = "2026-11-27"
derivation = "low = enforcement Rs 0.1 crore (a judgement, as in [cost]) + (610 - 598) = Rs 12.1 crore/yr. The new contracts also add capacity, so this is a low end."

[[cost.full.evidence]]
fields = ["cost.full.high"]
source = "CSTEP (2022), Emission inventory and pollution reduction strategies for Bengaluru"
url = "https://web.archive.org/web/2023/https://cstep.in/drupal/sites/default/files/2022-02/EI_Report_Final_04Feb22.pdf"
locator = "Sec. 3.2.2.4, printed p. 35-36 (PDF p. 53-54): waste burning PM2.5 1,411.5 t/yr; Table 3.2, printed p. 21 (PDF p. 39): emission factor PM2.5 8 g/kg; Table 5.11, printed p. 93: enforcement '<1' crore"
key = "O"
retrieved = "2026-11-27"
derivation = "waste burned = 1,411.5 t / 8 g/kg = 176,400 t/yr (483 t a day). high = enforcement Rs 1 crore + 176,400 t x Rs 6,390/t (next entry) = 1 + 113 = Rs 114 crore/yr."

[[cost.full.evidence]]
fields = ["cost.full.high"]
source = "The Hindu, 29 March 2025, 'BSWML to raise Rs 750 crore from user fee', and 13 March 2025, 'State government approves user fee for waste collection' (officials, reported)"
url = "https://www.thehindu.com/news/cities/bangalore/bwsml-to-raise-750-crore-from-user-fee/article69389589.ece"
locator = "29 March 2025: BBMP's 2025-26 budget gives Rs 1,400 crore to BSWML; 13 March 2025 (https://www.thehindu.com/news/cities/bangalore/state-government-approves-user-fee-for-waste-collection/article69325223.ece): BSWML collects, transports and disposes of 6,000 tonnes a day"
key = "S"
retrieved = "2026-11-27"
derivation = "all-in cost per tonne = Rs 1,400 crore / (6,000 t x 365) = Rs 6,390/t (includes capital and legacy waste, so an upper figure)."

[[evidence]]
fields = ["targets.waste_burning.cut"]
source = "CSTEP (2022), Emission inventory and pollution reduction strategies for Bengaluru"
url = "https://web.archive.org/web/2023/https://cstep.in/drupal/sites/default/files/2022-02/EI_Report_Final_04Feb22.pdf"
locator = "Table 5.7 'Emission reduction scenarios', section C 'Open waste burning', printed pp. 81-82 (PDF pp. 99-100): 'Ban open waste burning- reduction in open waste burning 50% | 30% | 20%' (HER | MER | LER), emission reduction potential the same; measure in Table 5.5 and roadmap Table 5.10 (printed p. 92: door-to-door collection 100%, segregation 100%)"
key = "O"
retrieved = "2026-11-27"
derivation = "p5 = LER 0.20, mode = MER 0.30, p95 = HER 0.50."

[[evidence]]
fields = ["cost.annual"]
source = "CSTEP (2022), Emission inventory and pollution reduction strategies for Bengaluru"
url = "https://web.archive.org/web/2023/https://cstep.in/drupal/sites/default/files/2022-02/EI_Report_Final_04Feb22.pdf"
locator = "Table 5.11 'Economic Comparison (HER vs MER vs LER)', printed p. 93 (PDF p. 111): 'Open Waste Burning | BBMP (Policy Implementation) | <1 | <1 | <1' crore"
key = "O"
retrieved = "2026-11-27"
derivation = "p95 = Rs 1 crore (the source's bound); p5 = Rs 0.1 crore, a judgement (the source gives only '<1'). Taken as yearly, the larger reading. Price year not stated; taken as 2021, the year before publication (February 2022)."
