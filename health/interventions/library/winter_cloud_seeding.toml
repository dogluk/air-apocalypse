# Delhi: seeding winter clouds to make rain wash the air. A long shot with odds close to zero.
name = "Cloud seeding over Delhi in winter (long shot)"
kind = "exposure"
scope = "city"
who_reaches = "everyone in Delhi, on the few winter days that have seedable cloud, if rain falls"
cities = ["Delhi"]
long_shot = true

start_year = 2027
ramp_years = 0
duration_years = 3
lag = "epa20"

p_success = 0.02
p_success_basis = "judgement: the lowest in the library. Delhi's winter air holds too little water to rain out much (under 1 mm even if every molecule in a 1 km column condensed), seeding only triggers storms that winter does not have the energy to make, and forcing it means out-heating the sun (bets/README.md, 'Why winter cloud seeding can't work in Delhi'); the October 2025 trials gave no rain in Delhi (cloud moisture 10-20% against about 50% needed). Not zero because the trials were few and in one dry week"

placeholders = []

notes = """
IIT Kanpur seeds clouds over Delhi with silver iodide and salt flares through each winter, on the
days that have cloud, hoping rain will wash particles out of the air. It is scored as a cut in what
everyone breathes, not as a cut to a cause, because rain would remove particles from every origin.
Everything here describes what happens if it works; the odds say how likely that is.

The October 2025 trials: two sorties on 28 October, 14 to 16 flares, no rain in Delhi (0.1 mm in
Noida and 0.2 mm in Greater Noida); cloud moisture 10-20%. IIT Kanpur's director said its 15 monitors
showed PM2.5 6-10% lower after the sorties. The Indian Express, reading the official monitors, found
PM2.5 had already fallen before the first sortie and rose afterwards. The trial report itself was
not read; all of this is from press accounts (evidence S; data/MISSING.md).

If it works: rain on the days with seedable cloud, about one day in ten (the director's estimate),
lowering PM2.5 by the 6-10% IIT Kanpur claimed for the trial, over the four winter months his season
cost covers (taken as October to January). That is generous to the measure: the claimed fall was
not shown to be caused by the seeding, and lasted hours, not days.

Cost: IIT Kanpur's director put a whole winter at Rs 20-30 crore (Rs 25-30 crore in another account),
against Rs 60 lakh for the 300 km^2 seeded on 28 October (about Rs 20,000 per km^2). The Delhi cabinet
sanctioned Rs 3.21 crore for five trials.
"""

[exposure]
covered = 1.0
hours = 0.1
cut = { dist = "uniform", p5 = 0.06, p95 = 0.10 }
months = [10, 11, 12, 1]

[cost]
driver = "city"
annual = { dist = "uniform", p5 = 200000000, p95 = 300000000 }
currency = "INR"
year = 2025

