# One table per data file, keyed by filename relative to health/data/.
# Fields: source, url, locator, retrieved, licence, method (downloaded|transcribed|derived),
# and script for derived tables.

["lifetables_srs.csv"]
source = "Office of the Registrar General & Census Commissioner, India. SRS Based Abridged Life Tables 2020-24 (May 2026)."
url = "https://censusindia.gov.in/nada/index.php/catalog/47148/download/51393/SRS-Abridged_Life_Tables_2020-2024.pdf"
catalog = "https://censusindia.gov.in/nada/index.php/catalog/47148"
sha256 = "148629ce39c9956fa6a2444ad606394b9104d40f9ac6efcebb1da7336461f19f"
locator = "Abridged life tables, report pp. 20-42 (PDF pp. 25-47): India and 22 states/UTs, 'Total' block, persons columns nqx, lx, nLx, ex. Cross-checked against Statement 3 (report p. 6, PDF p. 11)."
retrieved = "2026-11-10"
licence = "Government of India publication; no licence stated in the report or on the catalog page. Factual statistics reproduced with attribution."
method = "transcribed"
script = "scripts/build_baseline.py"
notes = """
Extracted with pdftotext -layout by the script. Checks in the script: l(x+n) = l(x)(1 - q(x)) within 3 for every row;
e0 in every table equals Statement 3. Spot check by eye against the rendered PDF, 2026-11-10: Kerala rows 0-1, 25-30,
45-50, 70-75, 85+ and Delhi rows 1-5, 30-35, 60-65, 80-85 (36 cells), all match. State names as printed in the table
headings ('Telengana' is mapped to 'Telangana', the spelling of Statement 3, in places.csv, read by airhealth.places.canonical_state).
Andhra Pradesh's nLx column is printed with five decimals; kept as printed.
"""

["population_age_state.csv"]
source = "Report of the Technical Group on Population Projections: Population Projections for India and States 2011-2036. National Commission on Population, MoHFW. Cover dated November 2019 (released July 2020)."
url = "https://nhm.gov.in/New_Updates_2018/Report_Population_Projection_2019.pdf"
sha256 = "9a9031c9c75d609e03ab94ce0ac6115cb9d8a9ab82d1b18a47b78e90ae01331b"
locator = "Table 11 (persons as on 1st July, every year 2011-2036, India and every state/UT; PDF pp. 86-98) and Table 18 (persons by age as on 1st March 2011/16/21/26/31/36, India, 21 states and the combined North-East states excluding Assam; PDF pp. 164-260)."
retrieved = "2026-11-10"
licence = "Government of India publication; no licence stated in the report. Factual statistics reproduced with attribution."
method = "derived"
script = "scripts/build_baseline.py"
notes = """
Columns: state (as printed, upper case), year, age_start (0, 1, 5, ..., 75, 80; 80 means 80+), population (persons, 1st July).
Derivation: band 0 is Table 18's '0-1' row (age under one); band 1 is '0-4' minus '0-1'. Each unit's age shares come from its
own Table 18, or the combined North-East table for Arunachal, Manipur, Meghalaya, Mizoram, Nagaland, Sikkim and Tripura, or India
for the other small states and UTs (Goa, Chandigarh, Puducherry, Ladakh, Lakshadweep, Andaman & Nicobar, Daman & Diu, Dadra &
Nagar Haveli). Shares are interpolated linearly in time between the 1st March tables, held after March 2036, and applied to the
unit's Table 11 total. The 80+ band is split into 80-84 and 85+ at load time (airhealth.baseline), not here.
Checks in the script: Table 11 persons = male + female within 2; Table 18 age groups sum to its total; Table 18 totals equal
Table 17's for the same unit; states and UTs sum to India in Table 11 (to 0.01% in every year).
Misprint found: the Table 18 for Uttarakhand (report p. 178, PDF p. 182) is headed 'PUNJAB'; the script names units from Table 17 and
checks totals, so it is read as Uttarakhand.
Spot check by eye against the rendered PDF, 2026-11-10: Table 18 NCT of Delhi rows 0-1, 0-4, 25-29, 60-64, 80+, Total for all
six years (36 cells); Table 11 Gujarat, Maharashtra, Andhra Pradesh for 2011, 2022, 2036 (9 cells). All match.
"""

["cause_share_ncd_lri.csv"]
source = "Office of the Registrar General & Census Commissioner, India. Sample Registration System: Causes of Death Statistics 2021-2023 (September 2025)."
url = "https://censusindia.gov.in/nada/index.php/catalog/46176/download/50424/SRS_COD-STATISTICS_2021-2023.pdf"
catalog = "https://censusindia.gov.in/nada/index.php/catalog/46176"
sha256 = "1622b1b105ddf5ba4b237c7658a372c2466b340af25316cd1cc593685b42f268"
locator = "Table 1.3A 'Distribution of Deaths in India: 2021-2023, Person', report p. 9 (PDF p. 16). Rows: the four major cause groups and 'Respiratory infections'; columns 0-4, 05-14, 15-29, 30-44, 45-54, 55-69, 70+ (percent of deaths in the age group)."
retrieved = "2026-11-10"
licence = "Government of India publication; no licence stated in the report or on the catalog page. Factual statistics reproduced with attribution."
method = "transcribed"
script = "scripts/build_baseline.py"
notes = """
All-India, persons; the report gives no state breakdown by age and cause (only EAG/other, rural/urban and six regions).
'Respiratory infections' (a subgroup of communicable conditions) stands in for lower respiratory infection; the report does not
split upper from lower. Chronic 'Respiratory diseases' sit inside Non-Communicable diseases.
Mapping onto the 19 bands (airhealth.baseline): 0-4 -> bands 0, 1; 05-14 -> 5, 10; 15-29 -> 15, 20, 25; 30-44 -> 30, 35, 40;
45-54 -> 45, 50; 55-69 -> 55, 60, 65; 70+ -> 70, 75, 80, 85. Ill-defined deaths are shared out in proportion to defined causes:
share = (ncd + respiratory infections) / (100 - ill-defined).
Check in the script: the four major groups sum to 100 within 0.25 in every age group.
Spot check by eye against the rendered PDF, 2026-11-10: all 35 cells in the file match.
"""

["places.csv"]
source = "Names as printed in the sources of this package: SRS life tables 2020-24, population projections 2011-2036, AQLI Annual Update 2025 (gadm1, gadm2), geoBoundaries gbOpen IND ADM1/ADM2, Pandey et al. 2021 appendix table 3, CPCB station files, Census 2011 table A-04 (I)."
url = "https://github.com/aqli-epic/aqli-update"
locator = "States and aliases: the STATES table in scripts/build_places.py. Districts: the (state, unit) pairs of exposure_aqli.csv and exposure_acag_total.csv. Cities: cities.csv."
retrieved = "2026-11-10"
licence = "Names are facts; the district lists inherit CC BY 4.0 (AQLI) and ODbL 1.0 (geoBoundaries ADM2, Pathways Data / LGD)."
method = "derived"
script = "scripts/build_places.py"
notes = """
Columns: name, kind (country, state, district, city), state (parent state; the state itself for a state; empty for India),
aliases (';'-separated). Canonical state names are those of baseline.states(). Matching in airhealth.places ignores case,
accents, punctuation and '&' versus 'and', so only spellings that differ beyond that are listed as aliases.
District names differ between the two satellite maps (GADM in AQLI, LGD 2021 in geoBoundaries: 'Bangalore' in both, but
'Ahmednagar'/'Ahmadnagar', 'Mumbai City'/'Mumbai'); both spellings are kept as separate districts, each found only in its own map.
"""

["exposure_aqli.csv"]
source = "Air Quality Life Index (AQLI), Energy Policy Institute at the University of Chicago. AQLI Annual Update 2025 data (data years 1998-2023), gadm0/gadm1/gadm2 wide CSVs."
url = "https://github.com/aqli-epic/aqli-update/tree/441f4e2241d9ec92567f080faa99dd3a29f7a90a/AQLI%20Annual%20Update%202025%20data"
sha256 = "4e330b30c99a66fac3019a5ee15a15407ff4bcb352f16eedb5e6353ec96d97b0"
locator = "gadm2.zip -> gadm2/gadm2_2023_wide.csv, rows name0 == 'India' (690 districts); columns name1, name, population, pm1998-pm2023, who1998-who2023. sha256 is of gadm2.zip; gadm1.zip d7af89aa509c66f8756442c8730215f76bd7d11bd7bfe439f748bc4ee6edbb22, gadm0.zip 9820a91a82fb0f442c15b760ea32f8e05504cd6ca289ec69b177751de9b706f9."
retrieved = "2026-11-10"
licence = "CC BY 4.0 (repository licence)"
method = "derived"
script = "scripts/build_exposure_aqli.py"
population_total = 1398021054
notes = """
Columns: state, unit (AQLI district), year, pm25 (µg/m³; satellite PM2.5 with mineral dust and sea salt removed, per the
release Readme), population (AQLI's, LandScan; one figure, the same in every year), aqli_years_who (AQLI's life-expectancy
gain if the WHO guideline of 5 µg/m³ were met). population_total is India's population in gadm0_2023_wide.csv.
Release choice: the repository Readme (2026-11-10) calls the 2025 release the 'latest completed release' and the 2026 folder
(data to 2024) 'work in progress ... should not be treated as a finalized AQLI release'. The 2026 files recompute the whole
series: NCT of Delhi pm2023 is 88.35 in the 2025 release and 89.81 in the 2026 files.
GADM codes Jammu and Kashmir and Ladakh as 'Z01', so India is selected by name0, not iso_alpha3.
Checks in the script: districts sum to the gadm0 India population exactly; population-weighted district means reproduce
every gadm1 state value in every year to 0.01 (largest gap 0.005, rounding). Spot check against the raw file, 2026-11-10:
Lucknow 2010 and 2023, Ernakulam 2023, Jaisalmer 2023 all match; India pm2023 41.0 (gadm0) equals the table's weighted mean.
One Telangana district is named 'NA' in gadm2 (population 1,547,413); written as 'Unnamed area'.
Use: airhealth.exposure keeps this file's split of each state among its districts and scales the state to the official
projection (population_age_state.csv) for the year asked, 2011-2036; other years keep this population.
"""

["exposure_acag_total.csv"]
source = "Atmospheric Composition Analysis Group (Washington University in St. Louis), surface PM2.5 V6.GL.02.04 (Shen et al. 2024, ACS ES&T Air, doi:10.1021/acsestair.3c00054), annual mean 2023 at 0.1°; weighted with WorldPop Global2 R2025A India 2023 1 km constrained UN-adjusted population; districts from geoBoundaries gbOpen IND ADM2 and states from ADM1."
url = "https://satpmdata.s3.us-east-1.amazonaws.com/archive/V6GL0204/CNNPM25c0p10/Annual/AS/V6GL02.04.CNNPM25.0p10.AS.202301-202312.nc"
worldpop_url = "https://data.worldpop.org/GIS/Population/Global_2015_2030/R2025A/2023/IND/v1/1km_ua/constrained/ind_pop_2023_CN_1km_R2025A_UA_v1.tif"
boundaries_url = "https://github.com/wmgeolab/geoBoundaries/tree/9469f09/releaseData/gbOpen/IND"
catalog = "https://sites.wustl.edu/acag/datasets/surface-pm2-5/"
sha256 = "543de3d4b0a0e97c2b458fc3b737a90b2c7053fc543bcc8646f34bf3c2d574cd"
locator = "Variable PM25 of the 2023 Asia-crop file. sha256 above is of the .nc; WorldPop tif c2859c04866c24759b66c3e327672832c78ad06772e436b8a1aceaf600b953bc; geoBoundaries-IND-ADM2.geojson 8bef6929fd65432e7dc775e7c44473e84efff064ebddbfd6b834e6291546db40; geoBoundaries-IND-ADM1.geojson 47aa0acb6f69868daee49143276f3ce323f18905ba7d38d0a86816b405028736."
retrieved = "2026-11-10"
licence = "ACAG: CC BY 4.0. WorldPop: CC BY 4.0. geoBoundaries IND ADM2: ODbL 1.0 (Pathways Data Pvt. Ltd., lgdirectory.gov.in); ADM1: CC BY 2.5 IN (DataMeet). The derived table is shared under ODbL 1.0."
method = "derived"
script = "scripts/build_exposure_acag.py"
population_total = 1431702948
notes = """
Columns: state, unit (geoBoundaries district), year (2023), pm25 (µg/m³, total PM2.5 including dust and sea salt), population
(WorldPop 2023 persons, summed over the district's pixels). population_total is the sum of the WorldPop India raster.
Year: 2023 is the last year of V6.GL.02.04 and the last year of the AQLI 2025 release, so the two maps share a year.
ACAG has since published V6.GL.03 (1998-2024) in the same bucket; not used here, the build pins V6.GL.02.04.
Method (script docstring): each WorldPop pixel takes the 0.1° cell and the district containing its centre; 4,752 populated
pixels (1,056,060 people, 0.074%) fall outside every district polygon and go to the nearest district (at most 16 pixels away).
No populated pixel falls in an empty ACAG cell. Corrections to geoBoundaries: Yanam put in Puducherry (the ADM1 outline
leaves it in Andhra Pradesh; by area overlap it is the only misplaced district); 'Hydrabad' spelled Hyderabad; a Ladakh unit
named 'DATA NOT AVAILABLE' (4,507 people) written as 'Unnamed area'; trailing spaces stripped ('North ').
Cross-check: India population-weighted mean 49.8 here against 47.1 in ACAG's own region summary
(archive/V6GL0204/RegionSummaries/GlobalPM25-V6GL0203-Annual-1998-2023-wThresFrac.csv, labelled V6GL0203 and weighted by
ACAG's population); states differ from ACAG's state summary by -7 to +9 µg/m³, most within ±5 (largest: Assam +9.0,
Lakshadweep -6.8). Running the same
script on the 0.01° file gives 50.2, so resolution is not the gap; the label suggests the summary is the earlier
V6.GL.02.03 data, which V6.GL.02.04 revised for 'abnormally low values'.
WorldPop R2025A puts fewer people in the densest cores than the census does (Mumbai island ~0.9 million) and more in some
surrounding districts; this moves district weights within a state, not the cities' populations (cities.csv).
Use: airhealth.exposure keeps this file's split of each state among its districts and scales the state to the official
projection (population_age_state.csv) for the year asked.
"""

