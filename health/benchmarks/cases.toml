# Open-tier reproduction benchmarks. benchmarks/run.py computes each case; tests/test_benchmarks.py
# checks |ours / published - 1| <= tolerance; README.md is generated by run.py.
#
# Fields: in_short is the plain-language paragraph README.md shows; why_different has the detail.
# measures = share (deaths attributable / all deaths), deaths (per year), or years (life
# expectancy gained). published is in the same unit. place, curve, map, year, counterfactual (µg/m³)
# and the optional pm25_override (µg/m³, every unit's starting level) are our configuration.
# The default tolerance is 0.15; a wider one carries tolerance_why. Nothing here is tuned to a
# published number: the year is the paper's own (or the middle of its period), the map the one
# closest to the paper's, the curve the paper's.
#
# Every published value was read at its source on 2026-11-10 (locator says where).

[[case]]
id = "jaganathan2024_share"
study = "Jaganathan et al. 2024"
measures = "share"
published = 0.249
published_text = "24.9% (95% CI 19.5-32.5) of total mortality attributable to PM2.5 above 5 µg/m³, 2009-19"
source_url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC11790315/"
locator = "Summary (Findings); Table 2, 'PM2.5 concentrations higher than WHO guidelines (≤5 μg/m3)', attributable fraction, both the 11-year total and 'Mean deaths per year' rows."
place = "India"
curve = "loglinear_jaganathan"
map = "aqli"
year = 2014
counterfactual = 5.0
tolerance = 0.15
in_short = "Same curve and same formula as the paper. Our exposure is the AQLI map for 2014, the middle of the paper's 2009-19, which strips out dust and sea salt; the paper built its own monitor-calibrated map of total PM2.5 for every year. The shares land within 4% of each other."
why_different = """
Same curve and the same attributable-fraction formula as the paper (Methods, 'Attributable mortality': (e^(βΔX) − 1)/e^(βΔX) × deaths, by district). The exposure differs: the paper used its own 1 km ensemble machine-learning model of total PM2.5 calibrated to 1,056 monitors, for each year 2009-19 (national population-weighted median of districts 38.9 µg/m³); we use the AQLI district map, which removes dust and sea salt, for one year, 2014, the middle of the paper's period (India 42.8 µg/m³, districts weighted by the 2014 projection). The deaths the fraction is taken of also differ (see the deaths case): the paper weights districts by their registered deaths, so states with fuller registration count for more; we weight by modelled deaths. Over 2011-19, the years our population projections cover, our share runs from 25.0% (2012) to 28.2% (2016); 2014 was picked as the middle year, not as the best match.
"""

[[case]]
id = "jaganathan2024_deaths"
study = "Jaganathan et al. 2024"
measures = "deaths"
published = 1_500_000
published_text = "1.5 million (95% CI 1.1-1.9) deaths a year attributable to PM2.5 above 5 µg/m³, mean over 2009-19"
source_url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC11790315/"
locator = "Table 2, 'PM2.5 concentrations higher than WHO guidelines (≤5 μg/m3)', 'Mean deaths per year' row: 1·5 (1·1–1·9) million; Discussion: 'We estimated that 1·5 million (95% CI 1·1–1·9) deaths occurred annually'."
place = "India"
curve = "loglinear_jaganathan"
map = "aqli"
year = 2014
counterfactual = 5.0
tolerance = 0.50
tolerance_why = """
The paper's count is a share of the deaths registered in the Civil Registration System, which misses many deaths; ours is a share of all deaths as modelled from SRS death rates. The two denominators differ by about 1.35×, and the shares agree within 4% (previous case), so the counts are expected to differ by about 1.4× for that reason alone. The band is set to hold that understood gap, not to close it. (It was ±65% while the map carried AQLI's 2023 population into 2014, which made the gap 1.55×; the map now carries the 2014 projection.)
"""
in_short = "The paper counts only deaths registered with the Civil Registration System, about 6.1 million a year, and many deaths in India are never registered (completeness ran from 30% to 100% by state). We count all deaths, from SRS death rates and the 2014 population: about 8.2 million. The shares nearly match, so the counts differ by about that ratio, 1.35 times, plus the 3% gap in the share. Compare the share, not the count."
why_different = """
The paper's denominator is registered deaths. Methods: 'we retrieved the annual all-cause mortality data from the Vital Statistics Division, Civil Registration System ... using 100% of all reported deaths'; Results: 'Reported annual mortality ranged from 4·5 million in 2009 to 7·3 million in 2019', and the completeness of death registration 'ranged from 30·2% to 100·0%' across states. Its 16.6 million deaths over 11 years at 24.9% imply about 6.06 million registered deaths a year. Ours: SRS 2020-24 death rates by age applied to the 2014 projected population (1,264 million, each state's AQLI districts scaled to its projection) with the 2014 age structure, about 8.19 million deaths, 1.35× theirs. One part of that gap is ours (the death rates are 2020-24's, not 2009-19's), and the rest is the deaths that were never registered. The paper's own 2019 figure points the same way: about 1.8 million attributable deaths that year (Results) against 7.3 million reported, 24.7%. The share is the comparable number; the count is not.
"""

[[case]]
id = "aqli2025_india_years"
study = "AQLI India fact sheet 2025"
measures = "years"
published = 3.5
published_text = "India, 41 µg/m³ in 2023: meeting the WHO guideline of 5 µg/m³ 'could add 3.5 years onto the life expectancy of an average Indian'"
source_url = "https://aqli.epic.uchicago.edu/files/India%20FactSheet_2025_GlobalWV.pdf"
locator = "Page 1, opening paragraph and first key take-away; data year 2023 (footnote 1: 'AQLI 2023 dataset', population-weighted)."
place = "India"
curve = "aqli"
map = "aqli"
year = 2023
counterfactual = 5.0
tolerance = 0.05
in_short = "Same exposure table, same coefficient (0.98 years per 10 µg/m³) and same 5 µg/m³ target as AQLI. Our districts are weighted by the 2023 population projection of their state (AQLI's split within each state), which puts India at 41.2 µg/m³ against AQLI's 41.0; that and AQLI's rounding to one decimal are all that separate the two."
why_different = """
Same exposure (AQLI's own district table, 2023), same coefficient (0.98 years per 10 µg/m³) and same counterfactual, so they should agree to rounding: AQLI prints one decimal. The tolerance is tighter than the default because nothing but arithmetic and weights separate the two. Two small differences remain: AQLI applies the 5 µg/m³ floor in each grid cell, we apply it to each district's mean; and AQLI weights districts by its own (LandScan) population, we by the official 2023 projection for each state, split among the state's districts as AQLI splits it (India 41.2 µg/m³ against 41.0; 1,390 million people against AQLI's 1,398 million).
"""

[[case]]
id = "aqli2025_delhi_years"
study = "AQLI India fact sheet 2025"
measures = "years"
published = 8.2
published_text = "NCT of Delhi, 88.4 µg/m³ in 2023: 8.2 years of life expectancy gained from meeting the WHO guideline of 5 µg/m³"
source_url = "https://aqli.epic.uchicago.edu/files/India%20FactSheet_2025_GlobalWV.pdf"
locator = "Page 3, table 'Potential life expectancy impacts of particulate pollution reductions in all states/UTs of India', row 'NCT of Delhi' (population 188.4 lakh, 88.4 µg/m³, 8.2 years); also page 1, last key take-away ('gaining 8.2 years of life expectancy')."
place = "Delhi"
curve = "aqli"
map = "aqli"
year = 2023
counterfactual = 5.0
tolerance = 0.05
in_short = "As for India: same table, coefficient and target, so only rounding separates them. Delhi here is the state (NCT of Delhi), as in AQLI's table."
why_different = """
As for India: same exposure table, coefficient and counterfactual, so only AQLI's rounding to one decimal separates the two. Our Delhi is the state (NCT of Delhi), as in AQLI's table, not the Census urban agglomeration.
"""

[[case]]
id = "burnett2018_india_maps"
study = "Burnett et al. 2018 (GEMM NCD+LRI), India 2015, on our map"
measures = "deaths"
published = 2_219_000
published_text = "India 2015, population-weighted PM2.5 74.0 µg/m³, 100% rollback: 2,219 thousand excess deaths (GEMM NCD+LRI)"
source_url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC6156628/"
locator = "Table 1, row 'India', rollback 100%: PM2.5 exposure 74.0 µg/m3, GEMM NCD+LRI 2,219 (thousands). The authors' deposited calculator gives 2,219,057 (see data/sources.toml, curves_gemm_ncd_lri.csv)."
place = "India"
curve = "gemm_ncd_lri"
map = "aqli"
year = 2015
counterfactual = 2.4
tolerance = 0.40
tolerance_why = """
Two known gaps multiply. Our map puts India's 2015 air far cleaner than the paper's exposure surface does (45.1 against 74.0 µg/m³), for a known reason (AQLI removes dust and sea salt; different model); at the same population and death rates that alone gives about 0.72 of the paper's deaths (this case over the next). And our baseline has about 11% fewer NCD+LRI deaths per person than the paper's, which the next case, at the paper's level, isolates (0.89). Together about 0.64. (The band was ±35% while the map carried AQLI's 2023 population, 9% above the 2015 projection, which hid the second gap.)
"""
in_short = "Same curve, year and counterfactual, but our map puts India's 2015 air at 45.1 µg/m³ against the paper's 74.0. AQLI removes dust and sea salt and uses a different model, so our air is cleaner and the deaths fewer. Our baseline also has about 11% fewer deaths per person from the causes GEMM covers (next case)."
why_different = """
Same curve (the authors' age-specific NCD+LRI parameters), same year, same counterfactual (2.4 µg/m³, the GEMM's own: Table 1's 100% rollback takes each country to it). Exposure: the paper used the 2015 surface of Shaddick et al. 2018 (satellite, chemical transport model and monitors fused by hierarchical Bayesian model, 0.1° grid, total PM2.5), 74.0 µg/m³ for India; the AQLI map gives 45.1 µg/m³ for 2015 because it removes mineral dust and sea salt and comes from a different model. Population: 1,280 million, the 2015 projection (each state's AQLI districts scaled to it). Death rates: ours are SRS 2020-24 all-cause rates times the SRS 2021-23 share of deaths that are NCD or respiratory infection; the paper's main text does not name its baseline mortality source (it says only 'the same estimates of exposure and baseline mortality rates' for every model), and its appendix could not be opened.
"""

[[case]]
id = "burnett2018_india_forced74"
study = "Burnett et al. 2018 (GEMM NCD+LRI), India 2015, at the paper's 74.0 µg/m³"
measures = "deaths"
published = 2_219_000
published_text = "India 2015, population-weighted PM2.5 74.0 µg/m³, 100% rollback: 2,219 thousand excess deaths (GEMM NCD+LRI)"
source_url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC6156628/"
locator = "Table 1, row 'India', rollback 100%: PM2.5 exposure 74.0 µg/m3, GEMM NCD+LRI 2,219 (thousands)."
place = "India"
curve = "gemm_ncd_lri"
map = "aqli"
year = 2015
counterfactual = 2.4
pm25_override = 74.0
tolerance = 0.15
in_short = "With every district set to the paper's 74.0 µg/m³, we land 11% below. Our population is the 2015 projection, so the gap is in deaths per person: our baseline has about 11% fewer deaths from the causes GEMM covers, at ages 25 and over, than the paper's. One national level also ignores how exposure is spread within India."
why_different = """
Every district is set to the paper's national level, 74.0 µg/m³, so exposure is taken out of the comparison and what is left is population and death rates. Ours is 10.8% below. Our population is the 1,280 million projected for 2015 (each state's AQLI districts scaled to its projection), so the gap is per person: about 155 attributable deaths per 100,000 here against about 173 if the paper's population was close to the projection. At the same curve and level that means fewer NCD+LRI deaths at ages 25 and over per person in our baseline (SRS 2020-24 rates and the 2015 age structure) than in the paper's unnamed baseline for 2015. (Before the map's population was scaled to the year, it carried AQLI's 2023 figure, 9% higher, and this case landed 2.6% below: the two gaps nearly cancelled.) A single national level also drops the spread of exposure within India. The paper's text does not say whether it applied the curve cell by cell or at the country average (its Fig. 2 is drawn against country averages, and the authors' calculator, as recorded in data/sources.toml for curves_gemm_ncd_lri.csv, sets India's total beside the single value 74.0); if it used the country average, this run matches its method, and if cell by cell, this run ignores the within-country distribution, which matters because the GEMM bends.
"""
