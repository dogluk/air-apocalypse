# Punjab: five more years of the crop-residue machinery subsidy (Happy Seeder and others).
name = "Subsidising Happy Seeders and other stubble machines in Punjab, five more years"
kind = "air"
scope = "region"
who_reaches = "everyone downwind of Punjab's paddy fields, through the outdoor air"

start_year = 2027
ramp_years = 4
duration_years = 5
lag = "epa20"

p_success = 0.7
p_success_basis = "judgement: the scheme already runs and delivers machines (about 1.2 lakh in five years), but the state's own plan shows the machines cover a small part of the paddy area, and farmers who rent them still pay about Rs 1,250 an acre"

placeholders = []

notes = """
The central scheme for in-situ crop residue management pays half the price of a machine for a farmer
and 80% for a cooperative or custom hiring centre. In Punjab it spent Rs 1,385.38 crore from 2018-19
to 2022-23 and delivered 1,17,672 machines (Government of Punjab's 2023 action plan). This measure is
the same again: five more years at that pace, Rs 277.08 crore a year, in rupees of about 2021 (the
middle of the five years; the sum mixes years).

How much burning it removes: the action plan reports 4.25 lakh hectares of wheat sown into paddy
mulch with Happy Seeders (status at 31 March 2023), out of 31.67 lakh hectares of paddy (2022): 13.4%
of the area. Another five years is taken to add as much again. How much of that area would otherwise
have been burned, rather than baled, ploughed in or left, is not known from any source read here, so
it is a judgement of a quarter to three quarters. The Happy Seeder area is the only machine area the
plan reports in a form that can be used; mulchers, choppers and balers bought with the same money are
not credited, so the effect is understated against the cost.

Which smoke that is: the cut is the share of Punjab's burning removed times Punjab's share of India's
exposure to crop-burning smoke, 0.49 to 0.70 in 2015-19 (Lan et al. 2022), because the source-receptor
table (data/receptor_stubble.csv) is all crop burning from every origin. The table is a fallback and
about 14 times smaller than Lan et al.'s national figure, so the result is likely understated
(flag receptor_fallback). It was not scaled to close that gap.

The machines outlive the five years; the benefit after that is not counted, which understates it.
The 2023 PM2.5 map already includes the area the scheme reached by then; this measure adds to it.
Shyamsundar et al. 2019 (Science, doi 10.1126/science.aaw4085), on the farm economics of the Happy
Seeder, could not be opened (data/MISSING.md).
"""

[region]
receptor = "receptor_stubble.csv"
cut = { dist = "uniform", p5 = 0.016, p95 = 0.070 }

[cost]
driver = "city"
annual = 2770760000
currency = "INR"
year = 2021
partial = "The cost is the government's share of the machines only; farmers' own half (or fifth) of the price, and the rent they pay to use the machines, are not counted."

[[evidence]]
fields = ["region.cut"]
source = "Government of Punjab (May 2023), Action Plan for Control of Burning of Paddy Crop Residue in the State of Punjab, Annexure-A to the Punjab Pollution Control Board's report to the National Green Tribunal in OA 632 of 2023"
url = "https://www.greentribunal.gov.in/sites/default/files/news_updates/Report%20by%20PPCB%20in%20OA%20No.%20632%20of%202023%20(In%20re%20News%20Item%20published%20in%20The%20Hindu%20dated%2006.10.2023%20titled%20Pollution%20takes%20a%20front%20seat%20as%20Stubble%20Fires%20Spike%20in%20Punjab).pdf"
locator = "Section 6.0 'Crop Residue Management Plan', row 9 'Use of crop residue as mulch for sowing of wheat', column 'Present status (baseline data as on 31.03.2023)': 'Mulch -4.25 lakh ha with Happy Seeders'; Section 2.0 table: 2022 area under paddy 31.67 lac ha. Punjab's share of exposure: Lan et al. 2022, Nat Commun 13:6537, Supplementary Table 9 (https://static-content.springer.com/esm/art%3A10.1038%2Fs41467-022-34093-z/MediaObjects/41467_2022_34093_MOESM11_ESM.xlsx), row 'Punjab', 'contribution to annual exposure', whole-year 2015-2019: 0.7, 0.67, 0.49, 0.53, 0.51."
key = "O"
retrieved = "2026-11-27"
derivation = "Area share 4.25 / 31.67 = 0.134; times the share that would otherwise have burned, 0.25 to 0.75 (a judgement); times Punjab's share 0.49 to 0.70: p5 = 0.134 x 0.25 x 0.49 = 0.016, p95 = 0.134 x 0.75 x 0.70 = 0.070."

[[evidence]]
fields = ["cost.annual"]
source = "Government of Punjab (May 2023), Action Plan for Control of Burning of Paddy Crop Residue in the State of Punjab, Annexure-A to the Punjab Pollution Control Board's report to the National Green Tribunal in OA 632 of 2023"
url = "https://www.greentribunal.gov.in/sites/default/files/news_updates/Report%20by%20PPCB%20in%20OA%20No.%20632%20of%202023%20(In%20re%20News%20Item%20published%20in%20The%20Hindu%20dated%2006.10.2023%20titled%20Pollution%20takes%20a%20front%20seat%20as%20Stubble%20Fires%20Spike%20in%20Punjab).pdf"
locator = "Section 2.1 (ii), table of the Central Sector Scheme for in-situ crop residue management (plan p. 3): Funds Received 2018-19 to 2022-23, Total Rs 1385.38 crores; CRM machines provided, total 117672; subsidy '@ 50% to individual farmers and @ 80% to registered farmer groups, panchayats, cooperative societies and farmer producer organizations'."
key = "O"
retrieved = "2026-11-27"
derivation = "Rs 1,385.38 crore / 5 years = Rs 277.076 crore a year; price year 2021 taken as the middle of 2018-19 to 2022-23."
