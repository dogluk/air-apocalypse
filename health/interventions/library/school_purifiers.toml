# Bengaluru: a HEPA purifier running in every classroom during school hours.
name = "HEPA purifiers in Bengaluru's classrooms"
kind = "exposure"
scope = "city"
who_reaches = "schoolchildren in Bengaluru, during school hours only"
cities = ["Bengaluru"]

start_year = 2027
ramp_years = 0
duration_years = 5
lag = "epa20"

p_success = 0.35
p_success_basis = "judgement: below the air measures' middle value (0.5), but above home purifiers, because use is decided by the school, not each household: in the Delhi Kendriya Vidyalaya trial teachers ran the purifiers in class and indoor PM2.5 fell as intended. Against it: no trial shows fewer deaths, children in purifier classrooms protected themselves less outside school (the same trial's policy brief, 2026), and sustained use needs filters bought and machines kept running in government schools for years"

placeholders = []

notes = """
Every classroom gets a HEPA purifier, run by the teacher during lessons with doors and windows
shut, for five years (a design choice). The outdoor air does not change; only children in class
breathe less, and only during school hours.

How much it cuts: from 49% (the mean fall in indoor PM2.5 across field studies of portable air
cleaners, Ebrahimifakhar et al. 2024) to 76% (the Delhi Kendriya Vidyalaya pilot: classrooms
averaged 133.16 µg/m³ and the purifiers cut 101.2 µg/m³; Ruiz-Tagle et al., Journal of Development
Economics registered report).

How long: the Right to Education Act's minimum of 800 instructional hours a year (classes 1-5) to
1,000 (classes 6-8), out of 8,760 hours in a year. The KV pilot assumed 4 hours a day, 5 days a
week, which is about the same.

Who: children aged 5-19 (ages = [5, 19], whole age bands), counted with their own death rates.
The share of them reached is 78.7%: Karnataka's UDISE+ enrolment for 2023-24 (pre-primary to
class 12) over Karnataka's projected 2023 population aged 5-19. Enrolment includes pre-primary
children under 5 and the age bands do not match school classes exactly, so this is a rough
share. It is a state figure used for Bengaluru; a migrant-heavy city probably has a smaller
share of children in school. Bengaluru's own school-by-school UDISE+ files exist (OpenCity) but
could not be downloaded (data/MISSING.md).

What counting children's own death rates changed (`airhealth score Bengaluru --measure
school_purifiers`, 2,000 draws, seed 0, curve loglinear_jaganathan): before, when 17.6% of all
people were credited with the city's all-age death rates, 14,800 life-years if it works (9,670 to
21,300) and 76.1 life-years per crore; after, 4,410 (2,880 to 6,340) and 22.7 per crore, about a third.
The cost did not change (the same children are counted). On curves that start at age 25
(gemm_ncd_lri, loglinear_vodonos) children now get nothing: those curves have no evidence on
children, which is not the same as evidence of no effect.

Cost per child: one Xiaomi Smart Air Purifier 4 (particle clean-air rate 400 m³/h, for rooms up to
516 sq ft, 48 m²) at Rs 18,999 per classroom, and its filter at Rs 3,499 every 6-12 months, shared
by 27 children (Karnataka's pupil-teacher ratio, with the RTE rule of at least one classroom per
teacher) to 50 (the average KV class in Delhi). 2026 prices are used as 2025 rupees. The KV trial
used larger machines (600 m³/h, rooms up to 60 m²); bigger classrooms may need two.

city-specific: the share of children in school (78.7%) and the pupil-teacher ratio (27) are Karnataka's (UDISE+); the other 49 cities get school_purifiers_india.toml, the same measure with India's figures.
"""

[exposure]
covered = 0.7871
hours = { dist = "uniform", p5 = 0.0913, p95 = 0.1142 }
cut = { dist = "uniform", p5 = 0.49, p95 = 0.76 }
ages = [5, 19]

[cost]
driver = "person"
once = { dist = "uniform", p5 = 380, p95 = 704 }
annual = { dist = "uniform", p5 = 70, p95 = 259 }
currency = "INR"
year = 2025
partial = "It leaves out electricity, installation, the staff time to keep machines running and filters changed, and a second machine where a classroom is larger than one unit covers."

[[evidence]]
fields = ["exposure.cut"]
source = "Ruiz-Tagle JC, Sangwan N, Jaime MM, Salazar C, Kacker K, Kumar P (2024), Behavioral and Technological Strategies to Mitigate Effects of Air Pollution on Children: Empirical Evidence from an RCT in Delhi's Schools, Journal of Development Economics registered report (stage 1), manuscript DEVEC-D-24-00902R1"
url = "https://afosterri.org/jdepreresults/wp-content/uploads/2024/11/ruiz-tagle-sangwan-jaime-salazar-kacker-kumar-behavioral-air-pol-9f0c421651eae910c6a5e0ab49e547dd.pdf"
locator = "Power analysis, 'Particle Pollution (PM2.5) inside classrooms', manuscript lines 501-507, printed pp. 18-19 (PDF pp. 37-38): pilot with seven purifiers, Aug-Dec 2022, 'The average PM2.5 pollution inside the classrooms is 133.16 μg/m3' and 'the average reduction in PM2.5 pollution inside classrooms that we observed in our pilot is 101.2 μg/m3'"
key = "O"
retrieved = "2026-11-27"
derivation = "p95 = 101.2 / 133.16 = 0.76. p5 = 0.49, the mean reduction across 83 field studies, Ebrahimifakhar et al. (2024), Sci Total Environ 912: 168786 (https://pubmed.ncbi.nlm.nih.gov/38008326/), abstract. The pilot's two numbers may cover slightly different days, so 0.76 is the optimistic end."

[[evidence]]
fields = ["exposure.hours"]
source = "The Right of Children to Free and Compulsory Education Act, 2009 (Act 35 of 2009), the Schedule"
url = "https://www.indiacode.nic.in/bitstream/123456789/19014/1/the_right_of_children_to_free_and_compulsory_education_act_2009.pdf"
locator = "The Schedule, item 3 'Minimum number of working days/instructional hours in an academic year': '(iii) eight hundred instructional hours per academic year for first class to fifth class; (iv) one thousand instructional hours per academic year for sixth class to eighth class'"
key = "O"
retrieved = "2026-11-27"
derivation = "p5 = 800 / 8760 = 0.0913; p95 = 1000 / 8760 = 0.1142 (share of all the hours in a year)."

[[evidence]]
fields = ["exposure.covered"]
source = "Ministry of Education (2024), Report on Unified District Information System for Education Plus (UDISE+) 2023-24"
url = "https://www.dsel-education.gov.in/static/uploads/2025/09/57501621802afd72e8beca744b1bc7c0.pdf"
locator = "Table 5.1 'Enrolment of students by school management and level of school education, 2023-24: All Management', p. 74: Karnataka total 11,926,303"
key = "O"
retrieved = "2026-11-27"
derivation = "11,926,303 / 15,151,594 = 0.7871, the share of 5-19-year-olds enrolled (exposure.ages = [5, 19]). 15,151,594 = Karnataka's projected population aged 5-9 (4,855,744), 10-14 (5,055,213) and 15-19 (5,240,637) on 1 July 2023, read from data/population_age_state.csv (rows KARNATAKA, 2023, age_start 5, 10, 15), which is the Report of the Technical Group on Population Projections (MoHFW, July 2020), Tables 11 and 18 (see data/sources.toml). Enrolment includes pre-primary children aged 3-5, so the share is rough; it stays below 1, so no cap was needed. A state ratio used for Bengaluru."

[[evidence]]
fields = ["cost.once"]
source = "Xiaomi India store, Xiaomi Smart Air Purifier 4"
url = "https://www.mi.com/in/product/xiaomi-smart-air-purifier-4/buy/"
locator = "Product page: 'Current Price ₹18999'; specifications page (https://www.mi.com/in/product/xiaomi-smart-air-purifier-4/): 'Particle CADR of up to 400m3/h', 'Effective coverage area of 301sq.ft - 516sq.ft.'"
key = "O"
retrieved = "2026-11-27"
