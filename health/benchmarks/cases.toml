# Open-tier reproduction benchmarks. benchmarks/run.py computes each case; tests/test_benchmarks.py
# checks it; README.md is generated by run.py.
#
# Each case states the ratio it expects (ours / published) and a band around that expectation:
# a case passes when |ratio / expected_ratio - 1| <= tolerance. expected_ratio is 1 where the
# inputs match the paper's; where they are known not to, it is the ratio the known difference
# should produce, worked out from the inputs and not from the result, and expected_why says how.
# A case expected at 0.64 therefore fails at 1.0, and a 10% bug in either direction fails
# every case. The bands are narrow on purpose; band_why says what the band has to hold.
#
# Other fields: in_short is the plain-language paragraph README.md shows; why_different has the
# detail. measures = share (deaths attributable / all deaths), deaths (per year), or years (life
# expectancy gained). published is in the same unit. place, curve, map, year, counterfactual
# (µg/m³) and the optional pm25_override (µg/m³, every unit's starting level) are our
# configuration. Nothing here is tuned to a published number: the year is the paper's own (or
# the middle of its period), the map the one closest to the paper's, the curve the paper's.
#
# Every published value was read at its source on 2026-11-10 (locator says where).

[[case]]
id = "jaganathan2024_share"
study = "Jaganathan et al. 2024"
measures = "share"
published = 0.249
published_text = "24.9% (95% CI 19.5-32.5) of total mortality attributable to PM2.5 above 5 µg/m³, 2009-19"
source_url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC11790315/"
locator = "Summary (Findings); Table 2, 'PM2.5 concentrations higher than WHO guidelines (≤5 μg/m3)', attributable fraction, both the 11-year total and 'Mean deaths per year' rows."
place = "India"
curve = "loglinear_jaganathan"
map = "aqli"
year = 2014
counterfactual = 5.0
expected_ratio = 1.0
tolerance = 0.10
band_why = "Same curve and formula; the exposure map and its year differ. Over 2011-19 our share runs from 25.2% to 28.4% on the AQLI map, 1% to 14% above the paper's 24.9%; 2014 is the middle year of the paper's period."
in_short = "Same curve and same formula as the paper. Our exposure is the AQLI map for 2014, the middle of the paper's 2009-19, which strips out dust and sea salt; the paper built its own monitor-calibrated map of total PM2.5 for every year. The shares land within 4% of each other."
why_different = """
Same curve and the same attributable-fraction formula as the paper (Methods, 'Attributable mortality': (e^(βΔX) − 1)/e^(βΔX) × deaths, by district). The exposure differs: the paper used its own 1 km ensemble machine-learning model of total PM2.5 calibrated to 1,056 monitors, for each year 2009-19 (national population-weighted median of districts 38.9 µg/m³); we use the AQLI district map, which removes dust and sea salt, for one year, 2014, the middle of the paper's period (India 42.8 µg/m³, districts weighted by the 2014 projection). The deaths the fraction is taken of also differ (see the deaths case): the paper weights districts by their registered deaths, so states with fuller registration count for more; we weight by modelled deaths. Over 2011-19, the years our population projections cover, our share runs from 25.2% (2012) to 28.4% (2016); 2014 was picked as the middle year, not as the best match.
"""

[[case]]
id = "jaganathan2024_deaths"
study = "Jaganathan et al. 2024"
measures = "deaths"
published = 1_500_000
published_text = "1.5 million (95% CI 1.1-1.9) deaths a year attributable to PM2.5 above 5 µg/m³, mean over 2009-19"
source_url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC11790315/"
locator = "Table 2, 'PM2.5 concentrations higher than WHO guidelines (≤5 μg/m3)', 'Mean deaths per year' row: 1·5 (1·1–1·9) million; Discussion: 'We estimated that 1·5 million (95% CI 1·1–1·9) deaths occurred annually'."
place = "India"
curve = "loglinear_jaganathan"
map = "aqli"
year = 2014
counterfactual = 5.0
expected_ratio = 1.392
tolerance = 0.08
expected_why = """
The paper's count is a share of the deaths registered in the Civil Registration System; ours is a share of all deaths. Its 16.6 million attributable deaths over 11 years at 24.9% imply 6.06 million registered deaths a year. Ours for 2014 is 8.44 million, at the SRS's own crude death rate for 2014 (6.7 per 1,000; data/death_reconciliation_by_year.csv). 8.44 / 6.06 = 1.392.
"""
band_why = "The band holds the gap between the two shares (previous case, within 10%); the denominators are known."
in_short = "The paper counts only deaths registered with the Civil Registration System, about 6.1 million a year, and many deaths in India are never registered (completeness ran from 30% to 100% by state). We count all deaths: 8.4 million for 2014, at the SRS's own rate for that year. The shares nearly match, so the counts differ by about that ratio, 1.39 times, plus the 4% gap in the share. Compare the share, not the count."
why_different = """
The paper's denominator is registered deaths. Methods: 'we retrieved the annual all-cause mortality data from the Vital Statistics Division, Civil Registration System ... using 100% of all reported deaths'; Results: 'Reported annual mortality ranged from 4·5 million in 2009 to 7·3 million in 2019', and the completeness of death registration 'ranged from 30·2% to 100·0%' across states. Its 16.6 million deaths over 11 years at 24.9% imply about 6.06 million registered deaths a year. Ours: SRS 2020-24 death rates by age, each band moved by the SRS's own rates by age for 2013-15 against 2020-24, applied to the 2014 projected population (1,264 million, each state's AQLI districts scaled to its projection) with the 2014 age structure, then scaled state by state at ages 45 and over to each state's SRS crude death rate for 2014 (data/death_reconciliation_by_year.csv): 8.44 million deaths, 1.39× theirs (9.01 million before that scaling). So the gap between all deaths and registered deaths in 2014 is about 1.4. (Before 2026-11-11 the tool applied 2020-24 rates and scaling to 2014 and got 7.18 million, 5.7 per 1,000, too low.) The paper's own 2019 figure points the same way: about 1.8 million attributable deaths that year (Results) against 7.3 million reported, 24.7%. The share is the comparable number; the count is not.
"""

[[case]]
id = "aqli2025_india_years"
study = "AQLI India fact sheet 2025"
measures = "years"
published = 3.5
published_text = "India, 41 µg/m³ in 2023: meeting the WHO guideline of 5 µg/m³ 'could add 3.5 years onto the life expectancy of an average Indian'"
source_url = "https://aqli.epic.uchicago.edu/files/India%20FactSheet_2025_GlobalWV.pdf"
locator = "Page 1, opening paragraph and first key take-away; data year 2023 (footnote 1: 'AQLI 2023 dataset', population-weighted)."
place = "India"
curve = "aqli"
map = "aqli"
year = 2023
counterfactual = 5.0
expected_ratio = 1.0
tolerance = 0.03
band_why = "Same table, coefficient and target; AQLI prints one decimal (3.5 is 3.45 to 3.55, ±1.4%) and weights districts by its own population."
in_short = "Same exposure table, same coefficient (0.98 years per 10 µg/m³) and same 5 µg/m³ target as AQLI. Our districts are weighted by the 2023 population projection of their state (AQLI's split within each state), which puts India at 41.2 µg/m³ against AQLI's 41.0; that and AQLI's rounding to one decimal are all that separate the two."
why_different = """
Same exposure (AQLI's own district table, 2023), same coefficient (0.98 years per 10 µg/m³) and same counterfactual, so they should agree to rounding: AQLI prints one decimal. The band is narrow because nothing but arithmetic and weights separate the two. Two small differences remain: AQLI applies the 5 µg/m³ floor in each grid cell, we apply it to each district's mean; and AQLI weights districts by its own (LandScan) population, we by the official 2023 projection for each state, split among the state's districts as AQLI splits it (India 41.2 µg/m³ against 41.0; 1,390 million people against AQLI's 1,398 million).
"""

[[case]]
id = "aqli2025_delhi_years"
study = "AQLI India fact sheet 2025"
measures = "years"
published = 8.2
published_text = "NCT of Delhi, 88.4 µg/m³ in 2023: 8.2 years of life expectancy gained from meeting the WHO guideline of 5 µg/m³"
source_url = "https://aqli.epic.uchicago.edu/files/India%20FactSheet_2025_GlobalWV.pdf"
locator = "Page 3, table 'Potential life expectancy impacts of particulate pollution reductions in all states/UTs of India', row 'NCT of Delhi' (population 188.4 lakh, 88.4 µg/m³, 8.2 years); also page 1, last key take-away ('gaining 8.2 years of life expectancy')."
place = "Delhi"
curve = "aqli"
map = "aqli"
year = 2023
counterfactual = 5.0
expected_ratio = 1.0
tolerance = 0.03
band_why = "As for India; 8.2 is 8.15 to 8.25, ±0.6%."
in_short = "As for India: same table, coefficient and target, so only rounding separates them. Delhi here is the state (NCT of Delhi), as in AQLI's table."
why_different = """
As for India: same exposure table, coefficient and counterfactual, so only AQLI's rounding to one decimal separates the two. Our Delhi is the state (NCT of Delhi), as in AQLI's table, not the Census urban agglomeration.
"""

[[case]]
id = "burnett2018_india_maps"
study = "Burnett et al. 2018 (GEMM NCD+LRI), India 2015, on our map"
measures = "deaths"
published = 2_219_000
published_text = "India 2015, population-weighted PM2.5 74.0 µg/m³, 100% rollback: 2,219 thousand excess deaths (GEMM NCD+LRI)"
source_url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC6156628/"
locator = "Table 1, row 'India', rollback 100%: PM2.5 exposure 74.0 µg/m3, GEMM NCD+LRI 2,219 (thousands). The authors' deposited calculator gives 2,219,057 (see data/sources.toml, curves_gemm_ncd_lri.csv)."
place = "India"
curve = "gemm_ncd_lri"
map = "aqli"
year = 2015
counterfactual = 2.4
expected_ratio = 0.619
tolerance = 0.08
expected_why = """
Two known differences multiply. Baseline deaths: the paper's are GBD 2015's, 6.46 million deaths from non-communicable disease and lower respiratory infection at ages 25 and over; ours for 2015 are 5.27 million, 0.816 of that (next case). Exposure: our map puts India at 45.1 µg/m³ against the paper's 74.0; on the paper's own baseline the curve gives 1.68 million deaths at 45.1 against 2.22 million at 74.0, a factor of 0.758. 0.816 × 0.758 = 0.619.
"""
band_why = "The band holds what the two factors leave out: exposure varies within India and the curve bends, so applying it district by district gives about 4% fewer deaths than applying it once at the national mean."
in_short = "Same curve, year and counterfactual, but our map puts India's 2015 air at 45.1 µg/m³ against the paper's 74.0 (AQLI removes dust and sea salt and uses a different model), which alone cuts the deaths to about three-quarters. Our baseline also has a quarter fewer deaths from the causes the curve covers than the paper's (next case). Together: a little over half."
why_different = """
Same curve (the authors' age-specific NCD+LRI parameters), same year, same counterfactual (2.4 µg/m³, the GEMM's own: Table 1's 100% rollback takes each country to it). Exposure: the paper used the 2015 surface of Shaddick et al. 2018 (satellite, chemical transport model and monitors fused by hierarchical Bayesian model, 0.1° grid, total PM2.5), 74.0 µg/m³ for India; the AQLI map gives 45.1 µg/m³ for 2015 because it removes mineral dust and sea salt and comes from a different model. Population: 1,280 million, the 2015 projection (each state's AQLI districts scaled to it). Baseline deaths: see the next case, which takes exposure out of the comparison. The factor for exposure (0.758) is the curve evaluated at the two national means with the paper's own baseline deaths by age (the authors' workbook, sheet 'NCD+ LRI baseline'), so it does not depend on this tool's baseline. Our district-by-district run lands 4-5% below the product of the two factors because the curve is concave: the same mean spread over cleaner and dirtier districts gives fewer deaths than the mean itself.
"""

[[case]]
id = "burnett2018_india_forced74"
study = "Burnett et al. 2018 (GEMM NCD+LRI), India 2015, at the paper's 74.0 µg/m³"
measures = "deaths"
published = 2_219_000
published_text = "India 2015, population-weighted PM2.5 74.0 µg/m³, 100% rollback: 2,219 thousand excess deaths (GEMM NCD+LRI)"
source_url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC6156628/"
locator = "Table 1, row 'India', rollback 100%: PM2.5 exposure 74.0 µg/m3, GEMM NCD+LRI 2,219 (thousands)."
place = "India"
curve = "gemm_ncd_lri"
map = "aqli"
year = 2015
counterfactual = 2.4
pm25_override = 74.0
expected_ratio = 0.816
tolerance = 0.05
expected_why = """
At the paper's exposure the only difference left is baseline deaths. The paper's are in the authors' workbook (sheet 'NCD+ LRI baseline': GBD 2015, from the GHDx results tool, retrieved 31 July 2017): India, ages 25 and over, 6,457,516 deaths from non-communicable disease and lower respiratory infection. Ours for 2015: 5,269,644. 5.270 / 6.458 = 0.816. Two things make ours smaller. Before any scaling it is 5,860,966 (0.908): GBD counts more deaths at 80 and over than the SRS, and our cause shares are too low at 25-29. Scaling deaths at 45 and over to the SRS crude death rate for 2015 takes it down by a further 10%.
"""
band_why = "The band holds the difference in the age pattern of the two baselines (the curve is steeper at younger ages); the totals are known."
in_short = "With every district set to the paper's 74.0 µg/m³ we land 18% below, and the reason is known: the paper's baseline (GBD 2015) has 6.46 million deaths at ages 25 and over from the causes the curve covers, ours has 5.27 million. Given the paper's own baseline, this tool's curve reproduces the paper's 2,219,057 deaths exactly. GBD counts more deaths in India than the SRS does, most of all at 80 and over, and our counts are scaled to the SRS's own crude death rate for 2015 (6.5 per 1,000)."
why_different = """
Every district is set to the paper's national level, 74.0 µg/m³, which is also how the paper computed it: the authors' workbook (data/sources.toml, curves_gemm_ncd_lri.csv) applies each age's curve once per country at the country's mean. Fed the workbook's own baseline deaths by age, this tool's GEMM curve at 74.0 gives 2,219,057 deaths, the workbook's and the paper's figure to the last death, so the curve is reproduced and the whole gap is the baseline. The workbook's baseline is GBD 2015 (sheet 'NCD+ LRI baseline', 'Source: Global Health Data Exchange (http://ghdx.healthdata.org/gbd-results-tool)', 'Based on data retrieved on July 31st, 2017'): India, 25 and over, 6,457,516 deaths from non-communicable disease plus lower respiratory infection, among 692 million people of that age. Ours for 2015: SRS 2020-24 death rates by age, each band moved by the SRS's own rates by age for 2014-16 against 2020-24, × the 2015 projected population × the SRS 2021-23 share of deaths that are non-communicable or respiratory infection, with deaths at 45 and over scaled to each state's SRS crude death rate for 2015 (data/death_reconciliation_by_year.csv): 5,269,644 deaths among 669 million. Before that scaling: 5,860,966 (0.908 of the workbook's). By age, ours before scaling: 4.54 million at 30 to 79, 1.27 million at 80 and over (against the workbook's 1.42 million, about 0.89) and 0.05 million at 25-29 (about 0.64: the SRS cause table has one share for ages 15-29, which is dominated by injuries among the young). After it: 4.11 million at 30 to 79, 1.10 million at 80 and over (about 0.78). GBD's estimate of deaths in old age is above what the SRS records, so a tool whose counts follow the SRS will sit below a GBD-based paper. (Before 2026-11-11 the tool applied 2020-24 rates and scaling to 2015: 4,869,398, ratio 0.754, at 5.8 deaths per 1,000 against the SRS's 6.5. Moving the rates to 2015's raised deaths at 80 and over most: SRS rates there were 1.3 to 1.6 times 2020-24's.) The IHME table itself is not committed; only these totals are quoted.
"""
