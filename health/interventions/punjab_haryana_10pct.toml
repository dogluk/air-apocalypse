# A year-round 10% cut in the annual mean across Punjab and Haryana.
name = "10% cut in Punjab and Haryana"
places = ["Punjab", "Haryana"]
start_year = 2027
ramp_years = 3
duration_years = 15
p_success = 0.3
notes = """
The 10% cut applies to every district of both states, all year. p_success, the ramp and both
costs are illustrative placeholders, not estimates: they show the file's shape and the cost
arithmetic, and should be replaced before any result is quoted.
"""

[change]
pct = -10

[cost]
once = { dist = "lognormal", p5 = 5e9, p95 = 5e10 }
annual = { dist = "lognormal", p5 = 1e9, p95 = 1e10 }
currency = "INR"
year = 2025
share_only_on_success = 0.0
