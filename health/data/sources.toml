["curves_loglinear.csv"]
source = "Three published studies, one row each, with each row's citation, url and locator in the file: Jaganathan et al. 2024 (Lancet Planet Health 8: e987-96), Brown et al. 2022 (Environ Health Perspect 130: 097004), Vodonos et al. 2018 (Environ Res 166: 677-89)."
url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC11790315/"
urls = ["https://pmc.ncbi.nlm.nih.gov/articles/PMC11790315/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC9472672/", "https://doi.org/10.1016/j.envres.2018.06.021"]
locator = "Per row, in the locator column. Jaganathan: Summary and Results (final difference-in-differences model). Brown: Results and Figure 2 (spatially adjusted, nonaccidental, ages 15-69). Vodonos: Section 3 Results and Table 2 (all-cause, all ages, slope at a study mean of 30 µg/m³)."
retrieved = "2026-11-10"
licence = "Published estimates re-typed with citation. Jaganathan: NIH author manuscript in PMC; Brown: open access in EHP; Vodonos: Elsevier article. Facts reproduced with attribution."
method = "transcribed"
notes = """
Columns: name, label, scale ('percent' = % change in mortality, 'rr' = relative risk), per_ugm3 (the increment the estimate is
per), estimate, lower, upper (95% interval as printed), floor (µg/m³), min_age (the youngest age band the curve applies
to; younger bands get a relative risk of 1), source, url, locator.
airhealth.curves converts each row to % per 10 µg/m³ by compounding on the log scale, pct10 = ((1 + pct/100)^(10/per) - 1) x 100
(an RR is first written as pct = (RR - 1) x 100), and takes se = (pct10(upper) - pct10(lower)) / (2 x 1.959964).
Read at source, 2026-11-10: Jaganathan and Brown from the PMC full text (Europe PMC fullTextXML of PMC11790315 and PMC9472672);
volume and pages from the same XML. Vodonos from a copy of the published PDF (Environmental Research 166 (2018) 677-689, publisher
header and pagination intact) at http://www.scientificintegrityinstitute.org/ERMAPM25JS080118.pdf; the publisher's copy is
paywalled. That text prints the 30 µg/m³ interval as '(95%CI-0.52-1.12)'; read as 0.52-1.12, which is symmetric about 0.82 as
the other intervals in that sentence nearly are.
Vodonos: the paper's slope falls with the study's mean concentration (inverse transform: beta per µg/m³ = 0.006 + 0.071 / mean,
Table 2), 1.29% at 10, 1.03% at 15.7, 0.82% at 30. One slope is a simplification, said so in the row's label. The paper's
studies have means up to 43.7 µg/m³ (Asia), so nothing in it speaks to Indian concentrations above that.
Brown: the paper reports the estimate at ages 15-69 and does not compute attributable deaths; min_age 15, so the curve is applied
from 15 upward, which extrapolates it past 69 (said so in the label). Its floor of 2 is the paper's modelling assumption (no effect at 0-2).
Jaganathan: estimated on all-age, all-cause district deaths; min_age 0, so it applies at every age.
Vodonos: min_age 25, the adult start used for GEMM (a project choice, not a figure from the paper).
"""

