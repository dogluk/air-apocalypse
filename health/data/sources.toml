script = "scripts/build_baseline.py"
notes = """
All-India, persons; the report gives no state breakdown by age and cause (only EAG/other, rural/urban and six regions).
'Respiratory infections' (a subgroup of communicable conditions) stands in for lower respiratory infection; the report does not
split upper from lower. Chronic 'Respiratory diseases' sit inside Non-Communicable diseases.
