# Bengaluru: a free HEPA air purifier, with replacement filters, for households that want one.
name = "Free HEPA purifiers for Bengaluru homes"
kind = "exposure"
scope = "city"
who_reaches = "households in Bengaluru that accept a free purifier, while it is running"
cities = ["Bengaluru"]

start_year = 2027
ramp_years = 0
duration_years = 5
lag = "epa20"

p_success = 0.3
p_success_basis = "judgement: below the air measures' middle value (0.5) because of adoption and use. Trials show purifiers lower indoor PM2.5 and blood pressure, but none shows fewer deaths; in Dalkhola (India) a blinded trial of a purifier at night plus an N95 found no fall in indoor PM2.5 or blood pressure with routine use (Yakkali et al. 2025, conference abstract), because people opened windows, switched it off for cold or noise, and worried about electricity. How little people run it is already in `hours`; these odds cover whether the cleaner air they do get cuts deaths as the risk curves say"

placeholders = []

notes = """
The city gives a household a HEPA purifier sized for one room (the bedroom) and pays for
replacement filters for five years (a design choice: the purifier's working life was not found at
a source). The measure reaches only the people in the households that take it, and only while the
purifier is running; the outdoor air does not change.

How much it cuts: field studies of portable air cleaners in real homes find a mean fall of 49% in
indoor PM2.5 (standard deviation 20%, 83 studies; Ebrahimifakhar et al. 2024). That is the cut
while it runs. The Shanghai crossover trial of Chen et al. (2015) found 57% with windows and doors
shut; Indian homes are leakier (Vyas et al. 2016, Delhi), so the field average is used.

How long it runs: this is the weak point. In Dhaka, the only trial found that metered purifier use
in homes given one free, households ran it 20 minutes a day on average, and 105 minutes a day if
they also got an air-quality monitor (Chowdhury, Garg, Jagnani and Mattsson 2026). Those are the
two ends of `hours`. Run all night, it would reach the 38% of the day urban Indians spend asleep
(Time Use Survey 2019, 543 minutes), but no trial found people using it that much, so that figure
is not used.

Who takes it: from 6% to 58% of households. The low end is Delhi, where 14.5% of medium and high
income households approached agreed to take part in a study and 44% of those accepted a free
month's trial of an indoor monitor (Greenstone, Lee and Sahai 2021); the high end is Dhaka, where
58% of households contacted were interested in a free monitor or purifier. The share reached hardly
changes life-years per crore (cost and benefit both scale with it); it sets the total.

Cost: Xiaomi Smart Air Purifier 4 Lite (true HEPA, for rooms of 25-43 m²) at Rs 10,999-11,499
on Xiaomi India's store (November 2026), and its filter at Rs 2,999, replaced every 6-12 months as
the maker advises. 2026 prices are used as 2025 rupees (the deflator stops at 2025). Electricity is
paid by the household and is not in the funder's cost.
"""

[exposure]
covered = { dist = "uniform", p5 = 0.064, p95 = 0.58 }
hours = { dist = "uniform", p5 = 0.0139, p95 = 0.0729 }
cut = { dist = "normal", p5 = 0.161, p95 = 0.819 }

[cost]
driver = "household"
once = { dist = "uniform", p5 = 10999, p95 = 11499 }
annual = { dist = "uniform", p5 = 2999, p95 = 5998 }
currency = "INR"
year = 2025
partial = "It leaves out electricity (paid by the household), the cost of running the hand-out, and the air-quality monitor that the upper end of use assumes."

[[evidence]]
fields = ["exposure.cut"]
source = "Ebrahimifakhar A, Poursadegh M, Hu Y, Yuill DP, Luo Y (2024), A systematic review and meta-analysis of field studies of portable air cleaners: performance, user behavior, and by-product emissions, Science of the Total Environment 912: 168786"
url = "https://pubmed.ncbi.nlm.nih.gov/38008326/"
locator = "Abstract: '83 of the 148 papers measured reductions in fine particulates (PM2.5) and found a mean reduction of 49 % with standard deviation of 20 %. The aggregated results were approximately normally distributed'"
key = "O"
retrieved = "2026-11-27"
derivation = "normal with mean 0.49 and SD 0.20: p5 = 0.49 - 1.645 x 0.20 = 0.161, p95 = 0.49 + 1.645 x 0.20 = 0.819. Chen et al. 2015 (JACC 65: 2279, abstract: 57%, 96.2 to 41.3 µg/m³, sealed dormitory rooms) lies inside this range."

