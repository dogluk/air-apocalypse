source = "Chowdhury A, Garg T, Jagnani M, Mattsson M (2026), Residential Air Purifiers and the Value of Clean Air (working paper, version of 8 October 2026)"
url = "https://ceg.hkust.edu.hk/upload/paper/Paper_+20261030_Martin+Mattsson.pdf"
locator = "Sec. 5.1 'Baseline usage is very low' and Sec. 5.3 'Monitors raise usage', printed p. 16 (PDF p. 17): free purifier, no monitor or electricity compensation, 'average use was only 20 minutes per day'; with a monitor, '105 minutes per day on average'"
key = "O"
retrieved = "2026-11-27"
derivation = "p5 = 20 / 1440 = 0.0139; p95 = 105 / 1440 = 0.0729 (share of the day the purifier runs). Smart-socket metered use, Dhaka, winter 2023-24."

[[evidence]]
fields = ["exposure.covered"]
source = "Chowdhury A, Garg T, Jagnani M, Mattsson M (2026), Residential Air Purifiers and the Value of Clean Air (working paper, version of 8 October 2026)"
url = "https://ceg.hkust.edu.hk/upload/paper/Paper_+20261030_Martin+Mattsson.pdf"
locator = "Footnote 6, printed p. 9 (PDF p. 10): 'Only 0.8% of contacted households owned a purifier, 73% had Wi-Fi, and 58% expressed interest'"
key = "O"
retrieved = "2026-11-27"
derivation = "p95 = 0.58 (Dhaka: households contacted that were interested in a free monitor or purifier). p5 = 0.145 x 0.44 = 0.064 from Greenstone, Lee and Sahai (2021), Indoor Air Quality, Information, and Socio-Economic Status: Evidence from Delhi, BFI working paper 2021-106 (https://bfi.uchicago.edu/wp-content/uploads/2021/01/BFI_WP_202106.pdf), PDF p. 5: of 8,877 households approached '85.5 percent declined or were unable to participate', and '56.0 percent of households turned down the free user trial with an IAQM' (a monitor, the nearest Indian measure of take-up of a free anti-pollution device)."

